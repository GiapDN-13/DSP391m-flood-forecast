# Pipeline dự báo hằng ngày — thay thế "home server" trong kế hoạch gốc.
# Bật từ W11. Trước đó để workflow_dispatch thủ công cho đỡ tốn quota.
name: daily-forecast

on:
  schedule:
    - cron: "0 22 * * *"   # 22:00 UTC = 05:00 giờ VN
  workflow_dispatch:

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tải model đã train từ Release
        run: |
          gh release download v1.0 --pattern "*.pkl" --dir models/ || \
            echo "Chưa có release v1.0 — bỏ qua, chạy thử pipeline thôi"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Chạy dự báo
        run: python -m src.models.predict_daily

      - name: Lưu kết quả
        uses: actions/upload-artifact@v4
        with:
          name: forecast-${{ github.run_number }}
          path: data/processed/forecast_latest.csv
          retention-days: 30

      - name: Báo khi thất bại
        if: failure()
        run: echo "::warning::Pipeline hằng ngày lỗi — kiểm tra trước buổi họp thứ 4"
