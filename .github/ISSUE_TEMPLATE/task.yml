name: Task
description: Một đầu việc cụ thể trong kế hoạch
title: "[Wxx] "
labels: []
body:
  - type: textarea
    id: goal
    attributes:
      label: Mục tiêu
      description: Làm việc này để được cái gì?
      placeholder: Ví dụ - Xác định ô lưới GloFAS nằm đúng dòng sông Hương
    validations:
      required: true

  - type: textarea
    id: dod
    attributes:
      label: Xong khi nào (Definition of Done)
      description: >
        Nếu issue gắn với một FR, CHÉP THẲNG cột "Tiêu chí nghiệm thu" từ docs/SPEC.md vào đây.
        Không viết lại theo ý mình. Tiêu chí phải kiểm được, không nói chung chung.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: howto
    attributes:
      label: Gợi ý cách làm
      description: |
        BẮT BUỘC điền khi người làm không phải người viết issue.
        Ghi rõ - input ở đâu, output để đâu, dùng hàm/file nào, tham khảo notebook nào.
    validations:
      required: false

  - type: input
    id: req
    attributes:
      label: ID yêu cầu (docs/SPEC.md)
      description: Ví dụ FR-D1, FR-M3, NFR-4. Để trống nếu là việc vận hành không gắn yêu cầu nào.
      placeholder: FR-D1

  - type: input
    id: week
    attributes:
      label: Tuần
      placeholder: W3
    validations:
      required: true

  - type: dropdown
    id: owner
    attributes:
      label: Người làm
      options:
        - Giáp
        - Đức
        - Huyền
        - Cả team
    validations:
      required: true

  - type: input
    id: effort
    attributes:
      label: Ước lượng (giờ)
      placeholder: "3"

  - type: input
    id: due
    attributes:
      label: Hạn nội bộ
      placeholder: 2026-10-08

  - type: textarea
    id: notes
    attributes:
      label: Phụ thuộc / ghi chú
      placeholder: "Cần xong #12 trước"
